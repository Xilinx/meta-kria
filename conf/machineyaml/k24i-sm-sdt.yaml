args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0305_1_03050000/external/k24i-sm-sdt/k24i-sm-sdt_2026.1_0305_1_03050000.tar.gz
    - --machine-name k24i-sm-sdt
    - -g full
    - --require-machine include/k24-sm.inc
    - --domain-file ${LAYER_PATH_kria-layer}/conf/domainyaml/k24-cortexa53-linux-conf.yaml ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/openamp-overlay-zynqmp.yaml
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
    CONFIG_YOCTO_BBMC_CORTEXR5_1_BAREMETAL: y
    CONFIG_SUBSYSTEM_BOOTMODE_2: y

machine:
    pre:
    post:
        SPI_IMAGE_SIZE:
            comment: 'QSPI flash size (64MB)'
            op: '='
            val: '0x400_0000'
