inherit:
    ${LAYER_PATH_kria-layer}/conf/machineyaml/k26-smk-kr-sdt.yaml
args:
    - --machine-name k26-smk-kr-sdt-multidomain
args_append:
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/openamp-overlay-zynqmp.yaml
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXA53_0_BAREMETAL: y
    CONFIG_YOCTO_BBMC_CORTEXR5_1_BAREMETAL: y
    CONFIG_SUBSYSTEM_BOOTMODE_2: y

machine:
    pre:
    post:
        require:
            comment: "K26 + KR260"
            op: 'conf/machine/include/kria-qemu-kr.inc'
        UBOOT_DT_FILES:
            op: '='
            val: " zynqmp-sck-kr-g-revA.dtso zynqmp-sck-kr-g-revB.dtso "
        DTB_FILE_NAME:task-install:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kr-g-revB.dtb"
        DTB_FILE_NAME:task-deploy:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kr-g-revB.dtb"
        PR:append:pn-device-tree:
            op: '='
            val: ".2"
        PACKAGECONFIG:append:pn-xilffs:
            comment: 'Baremetal Image-recovery requires xilffs with ramfs support'
            op: '='
            val: ' ramfs'
        QEMU_FLASH_TYPE:
            op: '='
            val: 'qspi'
        QEMU_FLASH_FILE:
            op: '='
            val: 'kria-qspi-${MACHINE}'
        SPI_IMAGE_SIZE:
            comment: 'QSPI flash size (64MB)'
            op: '='
            val: '0x400_0000'
        QEMU_HW_FLASH:append:
            comment: 'QSPI Boots from offset (0x20_0000)'
            op: '='
            val: " -boot multiboot=${@int(int('0x20_0000', 0) / ( 32 * 1024))}"
