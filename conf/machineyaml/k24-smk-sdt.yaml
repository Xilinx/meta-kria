args:
    - --hw-description https://petalinux.xilinx.com/sswreleases/rel-v2025.2/sdt/2025.2/2025.2_0928_1_09290000/external/k24-smk-sdt/k24-smk-sdt_2025.2_0928_1_09290000.tar.gz
    - --require-machine include/k24-smk.inc
    - --machine-name k24-smk-sdt
    - -g full
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/recipes-libraries/open-amp/overlays/openamp-overlay-zynqmp.yaml
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
machine:
    pre:
    post:
        IMGRCRY_DEPENDS:
            comment: "Default imgrcry configuration, using fsbl multiconfig"
            op: '='
            val: "image-recovery:do_deploy"
        IMGRCRY_MCDEPENDS:
            op: '='
            val: ""
        IMGRCRY_DEPLOY_DIR:
            op: '='
            val: "${TOPDIR}/tmp/deploy/images/${MACHINE}/"
        IMGRCRY_IMAGE_NAME:
            op: '='
            val: "image-recovery-${MACHINE}"
