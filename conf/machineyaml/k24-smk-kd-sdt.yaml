args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0131_1_02010000/external/k24-smk-kd-sdt/k24-smk-kd-sdt_2026.1_0131_1_02010000.tar.gz
    - --require-machine include/k24-smk.inc
    - --machine-name k24-smk-kd-sdt
    - -g full
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/openamp-overlay-zynqmp.yaml ${LAYER_PATH_kria-layer}/conf/domainyaml/k24-cortexa53-linux-conf.yaml
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
machine:
    pre:
    post:
        require:
            comment: "K24 + KD240"
            op: 'conf/machine/include/kria-qemu-kd.inc'
        UBOOT_DT_FILES:
            op: '='
            val: "zynqmp-sck-kd-g-revA.dtso"
        DTB_FILE_NAME:task-install:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kd-g-revA.dtb"
        DTB_FILE_NAME:task-deploy:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kd-g-revA.dtb"
        PR:append:pn-device-tree:
            op: '='
            val: ".2"
