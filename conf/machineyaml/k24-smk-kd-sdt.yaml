args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_1210_1_12110000/external/k24-smk-kd-sdt/k24-smk-kd-sdt_2026.1_1210_1_12110000.tar.gz
    - --require-machine include/k24-smk.inc
    - --machine-name k24-smk-kd-sdt
    - -g full
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
    CONFIG_YOCTO_BBMC_LINUX_DTSI: ${LAYER_PATH_kria-layer}/recipes-bsp/device-tree/files/k24-system-conf.dtsi
machine:
    pre:
    post:
        UBOOT_DT_FILES:
            op: '='
            val: "zynqmp-sck-kd-g-revA.dtso"
        DTB_FILE_NAME:task-install:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kd-g-revA.dtb"
        DTB_FILE_NAME:task-deploy:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kd-g-revA.dtb"
        PR:append:pn-device-tree:
            op: '='
            val: ".2"
