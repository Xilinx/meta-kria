args:
    - --hw-description https://petalinux.xilinx.com/sswreleases/rel-v2025.2/sdt/2025.2/2025.2_0730_1_07310318/external/k24-smk-kd-sdt/k24-smk-kd-sdt_2025.2_0730_1_07310318.tar.gz
    - --require-machine include/k24-smk.inc
    - --machine-name k24-smk-kd-sdt
    - -g full
    - --domain-file ${LAYER_PATH_xilinx-standalone-sdt}/recipes-libraries/open-amp/overlays/openamp-overlay-zynqmp.yaml
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
machine:
    pre:
    post:
        UBOOT_DT_FILES:
            op: '='
            val: "zynqmp-sck-kd-g-revA.dtso"
        DTB_FILE_NAME:task-install:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kd-g-revA.dtb"
        DTB_FILE_NAME:task-deploy:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kd-g-revA.dtb"
        PR:append:pn-device-tree:
            op: '='
            val: ".2"
