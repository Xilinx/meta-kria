args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_1223_1_12232355/external/k26-sm-sdt/k26-sm-sdt_2026.1_1223_1_12232355.tar.gz
    - --machine-name k26-sm-sdt
    - -g full
    - --require-machine include/k26-sm.inc
    - --domain-file ${LAYER_PATH_kria-layer}/conf/domainyaml/k26-cortexa53-linux-conf.yaml
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
machine:
    pre:
    post:
        require:
            comment: "Default to K26 + KV260"
            op: 'conf/machine/include/kria-qemu-kv.inc'
