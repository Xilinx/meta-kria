args:
    - --hw-description https://edf.amd.com/sswreleases/rel-v2026.1/sdt/2026.1/2026.1_0407_2_04071529/external/k26-smk-kv-sdt/k26-smk-kv-sdt_2026.1_0407_2_04071529.tar.gz
    - --machine-name k26-smk-kv-sdt
    - -g full
    - --require-machine include/k26-smk.inc
    - --domain-file ${LAYER_PATH_kria-layer}/conf/domainyaml/k26-cortexa53-linux-conf.yaml ${LAYER_PATH_xilinx-standalone-sdt}/conf/domainyaml/openamp-overlay-zynqmp.yaml
kconfig:
    CONFIG_YOCTO_BBMC_CORTEXA53_0_BAREMETAL: y
    CONFIG_YOCTO_BBMC_CORTEXR5_0_FREERTOS: y
    CONFIG_YOCTO_BBMC_CORTEXR5_1_BAREMETAL: y
    CONFIG_SUBSYSTEM_BOOTMODE_2: y

machine:
    pre:
    post:
        require:
            comment: "K26 + KV260"
            op: 'conf/machine/include/kria-qemu-kv.inc'
        UBOOT_DT_FILES:
            op: '='
            val: " zynqmp-sck-kv-g-revA.dtso zynqmp-sck-kv-g-revB.dtso "
        DTB_FILE_NAME:task-install:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kv-g-revB.dtb"
        DTB_FILE_NAME:task-deploy:pn-device-tree:linux:
            op: '='
            val: "${UBOOT_DTFILE_PREFIX}-zynqmp-sck-kv-g-revB.dtb"
        PR:append:pn-device-tree:
            op: '='
            val: ".2"
        PACKAGECONFIG:append:pn-xilffs:
            comment: 'Baremetal Image-recovery requires xilffs with ramfs support'
            op: '='
            val: ' ramfs'
        QEMU_FLASH_TYPE:
            op: '='
            val: 'qspi'
        QEMU_FLASH_FILE:
            op: '='
            val: 'kria-qspi-${MACHINE}'
        SPI_IMAGE_SIZE:
            comment: 'QSPI flash size (64MB)'
            op: '='
            val: '0x400_0000'
        QEMU_HW_FLASH:append:
            comment: 'QSPI Boots from offset (0x20_0000)'
            op: '='
            val: " -boot multiboot=${@int(int('0x20_0000', 0) / ( 32 * 1024))}"
