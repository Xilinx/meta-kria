reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2
  cma_reserved@4B000000:
    start: 0x4B000000
    size: 0x20000000
    compatible: "shared-dma-pool"
    reusable: true
    linux,cma-default: true

domains:
  APU_Linux:
    compatible:
      - "openamp,domain-v1"
    cpus:
      - cluster: cpus_a53
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: linux
    access:
      - dev: cma_reserved
        flags: 0

    reserved-memory:
      - cma_reserved@4B000000
