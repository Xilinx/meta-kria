reserved-memory:
  ranges: true
  "#size-cells": 2
  "#address-cells": 2
  cma_reserved@40000000:
    compatible: "shared-dma-pool"
    linux,cma-default: 1
    start: 0x40000000
    size: 0x32000000
    no-map: 1

domains:
  openamp_a53_1_cluster:
    compatible:
      - "openamp,domain-v1"
    cpus:
      - cluster: cpus_a53
        cpumask: 0x1
        mode:
          secure: true
          el: 0x3
    os,type: linux
    access:
      - dev: cma_reserved
        flags: 0

    reserved-memory:
      - cma_reserved@40000000
