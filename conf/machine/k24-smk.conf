#@TYPE: Machine
#@NAME: Generic Kria Starter Kit
#@DESCRIPTION: Kria K24 SMK Starter Kit SOM

require include/k24-smk.inc

# This is an 'XSCT' based BSP
XILINX_XSCT_VERSION = "2025.2"
XILINX_WITH_ESW = "xsct"

# Set Image Recovery Depends for XSCT machine
IMGRCRY_DEPENDS = "${@'image-recovery-make:do_deploy' if d.getVar('XILINX_WITH_ESW') == 'xsct' else ''}"

# Add system XSA
HDF_URI = 'https://petalinux.xilinx.com/sswreleases/rel-v2025.2/hdf-examples/2025.2/2025.2_0709_1_07100113/external/k24-smk/k24-smk-2025.2_0709_1.xsa'
HDF_URI[sha256sum] = 'fec321c383ee168caae711a59ea4cfcdc0b7617732b27541775f533a24983eb2'

#FPGA manager Variables
MACHINE_FEATURES += "fpga-overlay"
