# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILES_DYNAMIC += " \
openamp-layer:${LAYERDIR}/dynamic-layers/openamp-layer/recipes-*/*/*.bb \
openamp-layer:${LAYERDIR}/dynamic-layers/openamp-layer/recipes-*/*/*.bbappend \
xilinx-standalone-sdt:${LAYERDIR}/dynamic-layers/xilinx-standalone-sdt/recipes-*/*/*.bb \
xilinx-standalone-sdt:${LAYERDIR}/dynamic-layers/xilinx-standalone-sdt/recipes-*/*/*.bbappend \
xilinx-standalone-sdt:${LAYERDIR}/dynamic-layers/xilinx-standalone-sdt/recipes-*/*.bb \
xilinx-standalone-sdt:${LAYERDIR}/dynamic-layers/xilinx-standalone-sdt/recipes-*/*.bbappend \
xilinx-virtualization:${LAYERDIR}/dynamic-layers/xilinx-virtualization/recipes-*/*/*.bbappend \
"

BBFILE_COLLECTIONS += "kria-bsp"
BBFILE_PRIORITY_kria-bsp = "5"

LAYERSUMMARY_kria-bsp = "AMD Kria SOM and Starter Kit board support"
LAYERDESCRIPTION_kria-bsp = "BSP layer for AMD Kria K24/K26 system-on-modules \
and the KD240 Drives, KR260 Robotics, and KV260 Vision AI Starter Kits: \
machine .conf, machine/domain YAML, device trees, multiconfigs, bootbin, \
u-boot, device-tree, kria-qspi, board firmware and OpenAMP firmware \
examples."
BBFILE_PATTERN_kria-bsp = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_kria-bsp = "1"

LAYERDEPENDS_kria-bsp  = "core xilinx xilinx-standalone kria-core"

LAYERRECOMMENDS_kria-bsp = "jupyter-layer"

LAYERSERIES_COMPAT_kria-bsp = "wrynose"

LAYER_PATH_kria-bsp-layer = "${LAYERDIR}"

PREFERRED_VERSION_imgrcry-make = "${@d.getVar("XILINX_RELEASE_VERSION").replace('v','')}%"
