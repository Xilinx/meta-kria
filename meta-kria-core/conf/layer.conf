# We have a conf directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have a packages directory, add to BBFILES
BBFILES += " \
    ${LAYERDIR}/recipes-*/*/*.bb \
    ${LAYERDIR}/recipes-*/*/*.bbappend \
    "

BBFILE_COLLECTIONS += "kria-core"
BBFILE_PRIORITY_kria-core = "5"

LAYERSUMMARY_kria-core = "AMD Kria core infra and recipes"
LAYERDESCRIPTION_kria-core = "Core (non-BSP) layer for AMD Kria \
products: machine-independent runtime utilities (xmutil, \
xlnx-platformstats, axi-qos, ddr-qos, kria-dashboard), shared across \
the K24/K26 SOMs and Starter Kits."
BBFILE_PATTERN_kria-core = "^${LAYERDIR}/"
BBFILE_PATTERN_IGNORE_EMPTY_kria-core = "1"

LAYERDEPENDS_kria-core = "\
    core \
    xilinx \
    openembedded-layer \
    meta-python \
    "

LAYERRECOMMENDS_kria-core = "\
    jupyter-layer \
    openamp-layer \
    "

LAYERSERIES_COMPAT_kria-core = "wrynose"
